server:
  port: ${PORT:8085}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickettide_notifications}
    username: ${DB_USERNAME:tickettide}
    password: ${DB_PASSWORD:tickettide}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

tickettide:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    api-key: ${INTERNAL_API_KEY}
  email:
    from: ${EMAIL_FROM:no-reply@tickettide.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
