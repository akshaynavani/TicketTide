server:
  port: ${PORT:8082}

spring:
  application:
    name: event-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickettide_events}
    username: ${DB_USERNAME:tickettide}
    password: ${DB_PASSWORD:tickettide}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

tickettide:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    api-key: ${INTERNAL_API_KEY}
  s3:
    bucket: ${S3_BUCKET:tickettide-event-media}
    region: ${AWS_REGION:us-east-1}
    # Set to http://localstack:4566 for local development; leave empty on AWS.
    endpoint: ${S3_ENDPOINT:}
    presign-ttl: ${S3_PRESIGN_TTL:PT1H}

management:
  endpoints:
    web:
      exposure:
        include: health,info
