server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickettide_auth}
    username: ${DB_USERNAME:tickettide}
    password: ${DB_PASSWORD:tickettide}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

tickettide:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT2H}
  internal:
    api-key: ${INTERNAL_API_KEY}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
