# Local stand-in for AWS API Gateway: same public route table, /internal is never exposed.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 6m;

    log_format gateway '$remote_addr "$request" $status $body_bytes_sent ${request_time}s upstream=$upstream_addr';
    access_log /dev/stdout gateway;

    map $uri $upstream {
        ~^/api/(auth|admin)(/|$)        http://auth-service:8081;
        ~^/api/events(/|$)              http://event-service:8082;
        ~^/api/(orders|tickets)(/|$)    http://ticket-service:8083;
        ~^/api/payments(/|$)            http://payment-service:8084;
        ~^/api/notifications(/|$)       http://notification-service:8085;
        default                         "";
    }

    server {
        listen 8080;

        location /internal/ {
            return 404;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location /api/ {
            if ($upstream = "") {
                return 404;
            }
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Internal-Api-Key "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
